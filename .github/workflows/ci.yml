name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Match the npm that wrote package-lock.json (and publish.yml): npm 10
      # treats Sanity's optional TypeScript 6/7 peer as required and fails npm ci.
      - run: npm install -g npm@^11.15.0
      - run: npm ci
      - run: npm run check
